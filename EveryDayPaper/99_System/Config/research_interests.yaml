# evil-read-arxiv Configuration File
# 电网安全方向研究兴趣配置

# Language setting (zh/en)
language: "zh"

# Obsidian Vault path
vault_path: "C:/WorkBuddy/EveryDayPaper"

# Papers directory relative to vault
papers_dir: "20_Research/Papers"

research_domains:
