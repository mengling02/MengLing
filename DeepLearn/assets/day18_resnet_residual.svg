<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="a4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="760" height="480" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">
    残差连接：那个关键的 "+1" 是从哪来的
  </text>
  <text x="380" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">
    一条恒等捷径，让梯度在深层网络里有了"直通车"
  </text>

  <!-- 输入 x -->
  <rect x="338" y="72" width="84" height="34" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="380" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">x</text>

  <!-- 分叉 -->
  <line x1="380" y1="106" x2="380" y2="132" stroke="#475569" stroke-width="1.8"/>
  <line x1="250" y1="132" x2="560" y2="132" stroke="#475569" stroke-width="1.8"/>

  <!-- 左分支：F(x) -->
  <line x1="250" y1="132" x2="250" y2="176" stroke="#475569" stroke-width="1.8" marker-end="url(#a4)"/>
  <rect x="176" y="180" width="148" height="66" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="250" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">F(x)</text>
  <text x="250" y="225" text-anchor="middle" font-size="10.5" fill="#64748b">若干卷积层 + BN + ReLU</text>
  <text x="250" y="240" text-anchor="middle" font-size="10.5" fill="#64748b">（这里才是"要学的东西"）</text>

  <line x1="250" y1="246" x2="250" y2="304" stroke="#475569" stroke-width="1.8"/>
  <line x1="250" y1="304" x2="356" y2="304" stroke="#475569" stroke-width="1.8" marker-end="url(#a4)"/>

  <!-- 右分支：恒等捷径 -->
  <line x1="560" y1="132" x2="560" y2="304" stroke="#7c3aed" stroke-width="2.2"/>
  <line x1="560" y1="304" x2="404" y2="304" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#a4b)"/>
  <rect x="596" y="196" width="132" height="48" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="662" y="217" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5b21b6">恒等捷径</text>
  <text x="662" y="234" text-anchor="middle" font-size="10.5" fill="#6d28d9">identity / skip</text>

  <!-- 相加节点 -->
  <circle cx="380" cy="304" r="21" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="380" y="311" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">+</text>

  <!-- 输出 -->
  <line x1="380" y1="325" x2="380" y2="352" stroke="#475569" stroke-width="1.8" marker-end="url(#a4)"/>
  <rect x="300" y="356" width="160" height="38" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="380" y="381" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">y = F(x) + x</text>

  <!-- 梯度说明 -->
  <rect x="36" y="410" width="688" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="52" y="432" font-size="12.5" font-weight="700" fill="#1e3a8a">反向传播时会发生什么</text>
  <text x="52" y="456" font-size="12.5" fill="#334155">
    ∂y/∂x = ∂F(x)/∂x + 1        ← 这个 "+1" 就是捷径贡献的
  </text>
</svg>
