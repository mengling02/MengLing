<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="mkr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="mkb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="mkp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="760" height="500" fill="#ffffff"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">联邦学习：数据不动，模型动</text>
  <text x="380.0" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">各方只上传梯度/参数，原始数据一步都不出本地</text>
  <rect x="290" y="84" width="180" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="380.0" y="110.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">中央服务器</text>
  <text x="380.0" y="129.0" text-anchor="middle" font-size="10.5" fill="#1d4ed8">聚合各方更新（FedAvg）</text>
  <rect x="30" y="300" width="166" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="113.0" y="336.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#15803d">变电站 A</text>
  <text x="113.0" y="355.0" text-anchor="middle" font-size="10.5" fill="#166534">本地数据 · 不出域</text>
  <path d="M 113 296 L 113 200 L 300 200 L 300 146" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6,4"/>
  <path d="M 380 144 L 380 268 L 113 268 L 113 296" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6,4"/>
  <polygon points="113,296 109,306 117,306" fill="#7c3aed"/>
  <rect x="208" y="300" width="166" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="291.0" y="336.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#15803d">变电站 B</text>
  <text x="291.0" y="355.0" text-anchor="middle" font-size="10.5" fill="#166534">本地数据 · 不出域</text>
  <path d="M 291 296 L 291 200 L 300 200 L 300 146" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6,4"/>
  <path d="M 380 144 L 380 268 L 291 268 L 291 296" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6,4"/>
  <polygon points="291,296 287,306 295,306" fill="#7c3aed"/>
  <rect x="386" y="300" width="166" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="469.0" y="336.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#15803d">变电站 C</text>
  <text x="469.0" y="355.0" text-anchor="middle" font-size="10.5" fill="#166534">本地数据 · 不出域</text>
  <path d="M 469 296 L 469 200 L 300 200 L 300 146" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6,4"/>
  <path d="M 380 144 L 380 268 L 469 268 L 469 296" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6,4"/>
  <polygon points="469,296 465,306 473,306" fill="#7c3aed"/>
  <rect x="564" y="300" width="166" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="647.0" y="336.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#15803d">变电站 D</text>
  <text x="647.0" y="355.0" text-anchor="middle" font-size="10.5" fill="#166534">本地数据 · 不出域</text>
  <path d="M 647 296 L 647 200 L 300 200 L 300 146" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6,4"/>
  <path d="M 380 144 L 380 268 L 647 268 L 647 296" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6,4"/>
  <polygon points="647,296 643,306 651,306" fill="#7c3aed"/>
  <text x="44" y="194" font-size="11" font-weight="600" fill="#1d4ed8">↑ 上传：梯度 / 参数更新</text>
  <text x="44" y="290" font-size="11" font-weight="600" fill="#6d28d9">↓ 下发：聚合后的全局模型</text>
  <rect x="40" y="400" width="330" height="88" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="58" y="424" font-size="12" font-weight="700" fill="#0f172a">它解决的真实痛点</text>
  <text x="58" y="446" font-size="11" fill="#334155">电力数据涉及关键基础设施与商业机密，</text>
  <text x="58" y="466" font-size="11" fill="#334155">跨主体（不同电网公司、不同厂站）无法集中。</text>
  <rect x="390" y="400" width="330" height="88" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="408" y="424" font-size="12" font-weight="700" fill="#b91c1c">⚠️ 三个必须知道的坑</text>
  <text x="408" y="446" font-size="11" fill="#334155">① 数据不独立同分布 → 精度通常掉</text>
  <text x="408" y="466" font-size="11" fill="#334155">② 梯度会泄露信息（有攻击证明过）</text>
</svg>