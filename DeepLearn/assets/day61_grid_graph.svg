  <text x="58" y="459" font-size="11.5" font-weight="700" fill="#1e3a8a">和状态估计的接口：A 的稀疏结构 = H 的稀疏结构，两者都由拓扑决定</text>
  <text x="58" y="477" font-size="11" fill="#334155">所以"把电网建成图"不是换个模型玩玩，而是把 H 里本来就有的结构信息显式地交给神经网络。</text>
