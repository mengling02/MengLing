<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="mkr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="mkb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="mkp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">自编码器做异常检测：只学「正常」长什么样</text>
  <text x="380.0" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">训练时只喂正常样本 —— 模型没见过攻击，所以重建不出来</text>
  <rect x="30" y="150" width="110" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="85.0" y="211.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">输入 x</text>
  <text x="85.0" y="230.0" text-anchor="middle" font-size="10.5" fill="#1d4ed8">高维量测</text>
  <rect x="180" y="175" width="110" height="80" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="235.0" y="211.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">编码器</text>
  <text x="235.0" y="230.0" text-anchor="middle" font-size="10.5" fill="#475569">压缩</text>
  <rect x="330" y="195" width="100" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="380.0" y="211.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400e">潜变量 z</text>
  <text x="380.0" y="230.0" text-anchor="middle" font-size="10.5" fill="#b45309">低维</text>
  <rect x="470" y="175" width="110" height="80" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="525.0" y="211.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">解码器</text>
  <text x="525.0" y="230.0" text-anchor="middle" font-size="10.5" fill="#475569">重建</text>
  <rect x="620" y="150" width="110" height="130" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="675.0" y="211.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#15803d">重建 x̂</text>
  <text x="675.0" y="230.0" text-anchor="middle" font-size="10.5" fill="#166534">同维度</text>
  <line x1="140" y1="215" x2="176" y2="215" stroke="#475569" stroke-width="1.8" marker-end="url(#mk)"/>
  <line x1="290" y1="215" x2="326" y2="215" stroke="#475569" stroke-width="1.8" marker-end="url(#mk)"/>
  <line x1="430" y1="215" x2="466" y2="215" stroke="#475569" stroke-width="1.8" marker-end="url(#mk)"/>
  <line x1="580" y1="215" x2="616" y2="215" stroke="#475569" stroke-width="1.8" marker-end="url(#mk)"/>
  <path d="M 675 150 C 675 90, 85 90, 85 150" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#mkr)"/>
  <text x="380" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">重建误差 ‖x − x̂‖ = 异常分数</text>
  <rect x="40" y="300" width="680" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="58" y="324" font-size="12.5" font-weight="700" fill="#0f172a">为什么"只学正常"就够了</text>
  <text x="58" y="346" font-size="11.5" fill="#334155">训练目标是把输入重建回自己。模型只见过正常数据，于是它学会了"正常数据的压缩表示"。</text>
  <text x="58" y="368" font-size="11.5" fill="#334155">遇到正常样本 → 重建得准 → 误差小；遇到攻击样本 → 落不到学过的流形上 → 误差大。</text>
  <text x="58" y="392" font-size="11.5" font-weight="600" fill="#b91c1c">⚠️ 但这依赖一个前提：攻击样本"确实在分布外"。如果攻击者按 Δz = H·Δx 构造，它可能就在分布内 —— 这时自编码器也会失效。</text>
</svg>