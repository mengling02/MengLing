<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="mkr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="mkb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="mkp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">GCN 一层在做什么：把邻居的信息按权重收过来</text>
  <text x="380.0" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">h_i 的新表示 = 自己 + 所有邻居的加权平均，再乘一个可学习矩阵</text>
  <line x1="200" y1="210" x2="200" y2="120" stroke="#cbd5e1" stroke-width="1.6"/>
  <circle cx="200" cy="120" r="19" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="124" text-anchor="middle" font-size="10.5" fill="#475569">邻居</text>
  <line x1="200" y1="210" x2="110" y2="180" stroke="#cbd5e1" stroke-width="1.6"/>
  <circle cx="110" cy="180" r="19" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="110" y="184" text-anchor="middle" font-size="10.5" fill="#475569">邻居</text>
  <line x1="200" y1="210" x2="110" y2="260" stroke="#cbd5e1" stroke-width="1.6"/>
  <circle cx="110" cy="260" r="19" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="110" y="264" text-anchor="middle" font-size="10.5" fill="#475569">邻居</text>
  <line x1="200" y1="210" x2="200" y2="300" stroke="#cbd5e1" stroke-width="1.6"/>
  <circle cx="200" cy="300" r="19" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="304" text-anchor="middle" font-size="10.5" fill="#475569">邻居</text>
  <line x1="200" y1="210" x2="290" y2="260" stroke="#cbd5e1" stroke-width="1.6"/>
  <circle cx="290" cy="260" r="19" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="290" y="264" text-anchor="middle" font-size="10.5" fill="#475569">邻居</text>
  <line x1="200" y1="210" x2="290" y2="180" stroke="#cbd5e1" stroke-width="1.6"/>
  <circle cx="290" cy="180" r="19" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="290" y="184" text-anchor="middle" font-size="10.5" fill="#475569">邻居</text>
  <circle cx="200" cy="210" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
  <text x="200" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">i</text>
  <text x="200" y="352" text-anchor="middle" font-size="11.5" fill="#334155">度数 d=6 的节点 i 与它的邻居</text>
  <line x1="360" y1="210" x2="430" y2="210" stroke="#475569" stroke-width="1.8" marker-end="url(#mk)"/>
  <text x="395" y="198" text-anchor="middle" font-size="10.5" fill="#64748b">聚合</text>
  <rect x="450" y="96" width="280" height="230" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="590" y="122" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">h_i′ = Σⱼ (1/√(dᵢ·dⱼ)) * hⱼ * W</text>
  <text x="470" y="152" font-size="11.5" fill="#334155">① 先加自环：自己也算一个"邻居"</text>
  <text x="470" y="176" font-size="11.5" fill="#334155">② 按 1/√(dᵢ*dⱼ) 加权求和</text>
  <text x="470" y="200" font-size="11.5" fill="#334155">③ 乘可学习矩阵 W 做变换</text>
  <text x="470" y="228" font-size="11.5" font-weight="600" fill="#b91c1c">为什么除以 √(dᵢ*dⱼ) ？</text>
  <text x="470" y="250" font-size="11" fill="#334155">度数高的节点"话多"，输出会偏大。</text>
  <text x="470" y="270" font-size="11" fill="#334155">归一化后每个节点看到的是</text>
  <text x="470" y="290" font-size="11" fill="#334155">"加权平均"而不是"求和"，量级稳定。</text>
  <text x="470" y="312" font-size="11" fill="#64748b">不归一化 → 堆几层就指数爆炸</text>
  <rect x="40" y="386" width="680" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="58" y="408" font-size="11.5" font-weight="700" fill="#1e3a8a">一句话：GCN 就是"带结构的加权平均"，没有任何魔法</text>
  <text x="58" y="432" font-size="11" fill="#334155">它的价值在于：把"谁和谁物理相连"这件事，直接写进了模型的聚合规则里 —— 这是普通 MLP 拿不到的免费先验。</text>
</svg>