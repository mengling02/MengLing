<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="mkr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="mkb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="mkp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">LSTM：一条「细胞状态高速路」+ 三个门</text>
  <text x="380.0" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">门不是开关，是 0~1 的阀门 —— 决定让多少信息通过</text>
  <text x="40" y="106" font-size="12.5" font-weight="700" fill="#7c3aed">细胞状态 c（长期记忆 · 唯一贯穿全程的通道）</text>
  <line x1="60" y1="132" x2="620" y2="132" stroke="#7c3aed" stroke-width="2.6"/>
  <text x="60" y="122" font-size="11" fill="#5b21b6">c_{t-1}</text>
  <text x="592" y="122" font-size="11" fill="#5b21b6">c_t</text>
  <line x1="620" y1="132" x2="648" y2="132" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#mkp)"/>
  <circle cx="215" cy="132" r="20" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="215" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">×</text>
  <circle cx="440" cy="132" r="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">+</text>
  <rect x="40" y="236" width="150" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="115.0" y="263.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991b1b">遗忘门 f</text>
  <text x="115.0" y="282.0" text-anchor="middle" font-size="10.5" fill="#b91c1c">σ(W_f·[h,x])</text>
  <rect x="230" y="236" width="150" height="62" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="305.0" y="263.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#15803d">输入门 i</text>
  <text x="305.0" y="282.0" text-anchor="middle" font-size="10.5" fill="#166534">σ(W_i·[h,x])</text>
  <rect x="420" y="236" width="150" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="495.0" y="263.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">输出门 o</text>
  <text x="495.0" y="282.0" text-anchor="middle" font-size="10.5" fill="#1d4ed8">σ(W_o·[h,x])</text>
  <rect x="600" y="236" width="148" height="62" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="674.0" y="263.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9a3412">候选记忆</text>
  <text x="674.0" y="282.0" text-anchor="middle" font-size="10.5" fill="#ea580c">c̃ = tanh(W_c·[h,x])</text>
  <line x1="115" y1="236" x2="115" y2="178" stroke="#dc2626" stroke-width="1.8" marker-end="url(#mk)"/>
  <path d="M 115 178 L 195 178 L 195 140" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <text x="24" y="214" font-size="10.5" fill="#b91c1c">"忘掉多少"</text>
  <line x1="305" y1="236" x2="305" y2="190" stroke="#16a34a" stroke-width="1.8" marker-end="url(#mk)"/>
  <path d="M 305 190 L 422 190 L 422 148" fill="none" stroke="#16a34a" stroke-width="1.6"/>
  <text x="222" y="214" font-size="10.5" fill="#15803d">"写入多少"</text>
  <path d="M 674 236 L 674 206 L 460 206" fill="none" stroke="#ea580c" stroke-width="1.6"/>
  <circle cx="460" cy="206" r="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="460" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">×</text>
  <line x1="460" y1="197" x2="458" y2="152" stroke="#ea580c" stroke-width="1.8" marker-end="url(#mk)"/>
  <text x="500" y="226" font-size="10.5" fill="#9a3412">先与输入门相乘，再写进细胞状态</text>
  <rect x="40" y="340" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="140.0" y="364.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">h_{t-1} , x_t</text>
  <text x="140.0" y="383.0" text-anchor="middle" font-size="10" fill="#64748b">上一时刻隐状态 + 当前输入</text>
  <path d="M 240 368 L 285 368 L 285 302" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="296" y="352" font-size="10.5" fill="#64748b">同一个输入，喂给三个门</text>
  <line x1="495" y1="298" x2="495" y2="322" stroke="#2563eb" stroke-width="1.8" marker-end="url(#mk)"/>
  <text x="508" y="316" font-size="10.5" fill="#1d4ed8">"放行多少"</text>
  <path d="M 648 132 L 700 132 L 700 350 L 560 350" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5,4"/>
  <circle cx="560" cy="350" r="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="560" y="354" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">×</text>
  <rect x="360" y="400" width="260" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="490.0" y="423.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">h_t = o ⊙ tanh(c_t)</text>
  <text x="490.0" y="442.0" text-anchor="middle" font-size="10.5" fill="#1d4ed8">输出给下一层 / 下一时刻</text>
  <line x1="490" y1="359" x2="490" y2="396" stroke="#2563eb" stroke-width="1.8" marker-end="url(#mk)"/>
</svg>