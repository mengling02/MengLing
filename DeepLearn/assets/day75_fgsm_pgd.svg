<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="mkr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="mkb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="mkp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="760" height="450" fill="#ffffff"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">FGSM 与 PGD：一步走 vs 小步多走</text>
  <text x="380.0" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">都盯着同一个目标：让损失变大 —— 也就是让检测器判错</text>
  <rect x="30" y="80" width="340" height="280" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="200" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">FGSM · 一步到位</text>
  <text x="200" y="132" text-anchor="middle" font-size="11.5" fill="#334155">x′ = x + ε * sign(∇ₓ L)</text>
  <circle cx="110" cy="238" r="86" fill="#fee2e2" stroke="#f87171" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="110" y="146" text-anchor="middle" font-size="10.5" fill="#b91c1c">ε 球：扰动允许范围</text>
  <circle cx="110" cy="238" r="7" fill="#2563eb"/>
  <text x="110" y="262" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e3a8a">原始样本 x</text>
  <circle cx="196" cy="238" r="7" fill="#dc2626"/>
  <text x="206" y="228" font-size="10.5" font-weight="600" fill="#b91c1c">对抗样本 x′</text>
  <line x1="118" y1="238" x2="188" y2="238" stroke="#dc2626" stroke-width="2.4" marker-end="url(#mkr)"/>
  <text x="152" y="292" text-anchor="middle" font-size="10.5" fill="#b91c1c">一次走满 ε（落在球面上）</text>
  <text x="200" y="342" text-anchor="middle" font-size="11" fill="#475569">快，但常常不够强</text>
  <rect x="390" y="80" width="340" height="280" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="560" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">PGD · 小步多走 + 投影</text>
  <text x="560" y="132" text-anchor="middle" font-size="11.5" fill="#334155">x^{t+1} = Proj( x^t + α * sign(∇L) )</text>
  <circle cx="480" cy="238" r="86" fill="#dcfce7" stroke="#4ade80" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="480" y="146" text-anchor="middle" font-size="10.5" fill="#15803d">ε 球</text>
  <circle cx="480" cy="238" r="7" fill="#2563eb"/>
  <text x="480" y="262" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e3a8a">原始样本 x</text>
  <path d="M 480 238 L 526 216 L 552 182 L 560 218 L 586 192 L 548 166 L 522 196 L 558 200" fill="none" stroke="#16a34a" stroke-width="1.8"/>
  <circle cx="526" cy="216" r="4.2" fill="#16a34a"/>
  <circle cx="552" cy="182" r="4.2" fill="#16a34a"/>
  <circle cx="560" cy="218" r="4.2" fill="#16a34a"/>
  <circle cx="586" cy="192" r="4.2" fill="#16a34a"/>
  <circle cx="548" cy="166" r="4.2" fill="#16a34a"/>
  <circle cx="522" cy="196" r="4.2" fill="#16a34a"/>
  <circle cx="558" cy="200" r="4.2" fill="#16a34a"/>
  <circle cx="558" cy="200" r="7" fill="#dc2626"/>
  <text x="572" y="206" font-size="10.5" font-weight="600" fill="#b91c1c">x′</text>
  <text x="560" y="292" text-anchor="middle" font-size="10.5" fill="#15803d">每步只走 α，越界就拉回球面</text>
  <text x="560" y="342" text-anchor="middle" font-size="11" fill="#475569">慢，但是评估鲁棒性的标准做法</text>
  <rect x="30" y="376" width="700" height="62" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3"/>
  <text x="48" y="398" font-size="11.5" font-weight="700" fill="#9a3412">在电力场景，ε 不是"像素扰动"，而是"量测允许被改多少"</text>
  <text x="48" y="420" font-size="11" fill="#334155">所以 ε 必须与量测精度、物理可行性挂钩 —— 一个不设上限的攻击，在真实系统里没有意义。</text>
</svg>