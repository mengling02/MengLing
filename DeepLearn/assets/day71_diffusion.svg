<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="mkr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="mkb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="mkp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">扩散模型：先学会「加噪」，再学会「去噪」</text>
  <text x="380.0" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">生成过程 = 从纯噪声出发，一步步把噪声减掉</text>
  <text x="40" y="96" font-size="12.5" font-weight="700" fill="#dc2626">① 前向加噪（训练时用，不需要学）</text>
  <rect x="60" y="112" width="100" height="58" rx="8" fill="#dbeafe" stroke="#64748b" stroke-width="1.3"/>
  <text x="110" y="147" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">真实样本 x₀</text>
  <line x1="162" y1="141" x2="188" y2="141" stroke="#dc2626" stroke-width="1.8" marker-end="url(#mkr)"/>
  <rect x="190" y="112" width="100" height="58" rx="8" fill="#bfdbfe" stroke="#64748b" stroke-width="1.3"/>
  <text x="240" y="147" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">x₁</text>
  <line x1="292" y1="141" x2="318" y2="141" stroke="#dc2626" stroke-width="1.8" marker-end="url(#mkr)"/>
  <rect x="320" y="112" width="100" height="58" rx="8" fill="#93c5fd" stroke="#64748b" stroke-width="1.3"/>
  <text x="370" y="147" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">x₂</text>
  <line x1="422" y1="141" x2="448" y2="141" stroke="#dc2626" stroke-width="1.8" marker-end="url(#mkr)"/>
  <rect x="450" y="112" width="100" height="58" rx="8" fill="#c7d2fe" stroke="#64748b" stroke-width="1.3"/>
  <text x="500" y="147" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">…</text>
  <line x1="552" y1="141" x2="578" y2="141" stroke="#dc2626" stroke-width="1.8" marker-end="url(#mkr)"/>
  <rect x="580" y="112" width="100" height="58" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="1.3"/>
  <text x="630" y="147" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">x_T ≈ 纯噪声</text>
  <text x="380" y="192" text-anchor="middle" font-size="11" fill="#b91c1c">每步加一点高斯噪声：x_t = √(1−β_t)·x_{t−1} + √β_t·ε</text>
  <text x="40" y="232" font-size="12.5" font-weight="700" fill="#16a34a">② 反向去噪（这才是要学的）</text>
  <rect x="60" y="248" width="100" height="58" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="1.3"/>
  <text x="110" y="283" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">x_T ≈ 纯噪声</text>
  <line x1="162" y1="277" x2="188" y2="277" stroke="#16a34a" stroke-width="1.8" marker-end="url(#mk)"/>
  <rect x="190" y="248" width="100" height="58" rx="8" fill="#c7d2fe" stroke="#64748b" stroke-width="1.3"/>
  <text x="240" y="283" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">…</text>
  <line x1="292" y1="277" x2="318" y2="277" stroke="#16a34a" stroke-width="1.8" marker-end="url(#mk)"/>
  <rect x="320" y="248" width="100" height="58" rx="8" fill="#93c5fd" stroke="#64748b" stroke-width="1.3"/>
  <text x="370" y="283" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">x₂</text>
  <line x1="422" y1="277" x2="448" y2="277" stroke="#16a34a" stroke-width="1.8" marker-end="url(#mk)"/>
  <rect x="450" y="248" width="100" height="58" rx="8" fill="#bfdbfe" stroke="#64748b" stroke-width="1.3"/>
  <text x="500" y="283" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">x₁</text>
  <line x1="552" y1="277" x2="578" y2="277" stroke="#16a34a" stroke-width="1.8" marker-end="url(#mk)"/>
  <rect x="580" y="248" width="100" height="58" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="1.3"/>
  <text x="630" y="283" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">真实样本 x₀</text>
  <text x="380" y="328" text-anchor="middle" font-size="11" fill="#15803d">网络每一步预测"这一步加了什么噪声"，然后减掉它</text>
  <rect x="40" y="352" width="680" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="58" y="374" font-size="11.5" font-weight="700" fill="#0f172a">为什么这在电力场景有价值</text>
  <text x="58" y="396" font-size="11" fill="#334155">攻击样本占比 &lt; 0.1%，直接训练判别模型容易过拟合。扩散模型能"造"出物理可行的合成样本，扩充少数类 —— 但必须过物理可行性过滤。</text>
</svg>