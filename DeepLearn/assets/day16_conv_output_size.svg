<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">
    卷积输出尺寸：别背公式，看它怎么"扫"过去
  </text>
  <text x="380" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">
    输入 5×5，卷积核 3×3，步长 s = 1，填充 p = 0
  </text>

  <!-- 输入网格 5x5 -->
  <text x="60" y="88" font-size="12.5" font-weight="700" fill="#1e3a8a">输入 (5×5)</text>
  <g>
    <!-- 高亮的感受野 3x3 -->
    <rect x="60" y="100" width="108" height="108" fill="#dbeafe" stroke="none"/>
    <!-- 网格线 -->
    <g stroke="#cbd5e1" stroke-width="1" fill="none">
      <rect x="60" y="100" width="180" height="180" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
      <line x1="96" y1="100" x2="96" y2="280"/>
      <line x1="132" y1="100" x2="132" y2="280"/>
      <line x1="168" y1="100" x2="168" y2="280"/>
      <line x1="204" y1="100" x2="204" y2="280"/>
      <line x1="60" y1="136" x2="240" y2="136"/>
      <line x1="60" y1="172" x2="240" y2="172"/>
      <line x1="60" y1="208" x2="240" y2="208"/>
      <line x1="60" y1="244" x2="240" y2="244"/>
    </g>
    <!-- 感受野外框 -->
    <rect x="60" y="100" width="108" height="108" fill="none" stroke="#2563eb" stroke-width="2.6"/>
  </g>
  <text x="114" y="300" text-anchor="middle" font-size="11" fill="#2563eb">3×3 感受野</text>
  <text x="114" y="316" text-anchor="middle" font-size="11" fill="#64748b">（对应输出的 1 个格子）</text>

  <!-- 箭头 -->
  <line x1="270" y1="190" x2="486" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#a3)"/>
  <text x="378" y="176" text-anchor="middle" font-size="11.5" fill="#334155">卷积核 3×3</text>
  <text x="378" y="212" text-anchor="middle" font-size="11.5" fill="#334155">逐格滑动</text>

  <!-- 输出网格 3x3 -->
  <text x="520" y="88" font-size="12.5" font-weight="700" fill="#15803d">输出 (3×3)</text>
  <g>
    <g stroke="#cbd5e1" stroke-width="1" fill="none">
      <rect x="520" y="136" width="108" height="108" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
      <line x1="556" y1="136" x2="556" y2="244"/>
      <line x1="592" y1="136" x2="592" y2="244"/>
      <line x1="520" y1="172" x2="628" y2="172"/>
      <line x1="520" y1="208" x2="628" y2="208"/>
    </g>
    <rect x="520" y="136" width="36" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  </g>
  <text x="574" y="268" text-anchor="middle" font-size="11" fill="#15803d">每个格子 = 一次"对齐点乘求和"</text>

  <!-- 滑动次数说明 -->
  <rect x="660" y="130" width="80" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="700" y="152" text-anchor="middle" font-size="11" fill="#334155">横向</text>
  <text x="700" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">5−3+1</text>
  <text x="700" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">= 3</text>
  <text x="700" y="212" text-anchor="middle" font-size="11" fill="#334155">纵向同理</text>
  <text x="700" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">= 3</text>

  <!-- 公式 -->
  <rect x="40" y="336" width="680" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="380" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">
    out = (in + 2p − k) / s + 1
  </text>
  <text x="380" y="384" text-anchor="middle" font-size="12" fill="#334155">
    代入本例：(5 + 2×0 − 3) / 1 + 1 = 3
  </text>
  <text x="380" y="403" text-anchor="middle" font-size="11.5" fill="#64748b">
    直觉：用"窗口能放几个位置"去理解，比记公式可靠得多
  </text>
</svg>
