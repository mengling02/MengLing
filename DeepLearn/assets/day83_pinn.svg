<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="mkr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="mkb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="mkp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">PINN：把物理方程写进损失函数</text>
  <text x="380.0" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">网络不只拟合数据，还要让输出的状态"满足潮流方程"</text>
  <text x="40" y="104" font-size="11.5" fill="#b91c1c">纯数据驱动时，损失只有左边那一项 → 网络可能输出"物理上不可能"的解</text>
  <rect x="30" y="122" width="130" height="82" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="95.0" y="159.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">输入</text>
  <text x="95.0" y="178.0" text-anchor="middle" font-size="10.5" fill="#1d4ed8">量测 / 时间 / 负荷</text>
  <rect x="200" y="122" width="150" height="82" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="275.0" y="159.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">神经网络</text>
  <text x="275.0" y="178.0" text-anchor="middle" font-size="10.5" fill="#475569">MLP / GNN</text>
  <rect x="390" y="122" width="130" height="82" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="455.0" y="159.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5b21b6">输出 x̂</text>
  <text x="455.0" y="178.0" text-anchor="middle" font-size="10.5" fill="#6d28d9">电压幅值 + 相角</text>
  <line x1="160" y1="163" x2="196" y2="163" stroke="#475569" stroke-width="1.8" marker-end="url(#mk)"/>
  <line x1="350" y1="163" x2="386" y2="163" stroke="#475569" stroke-width="1.8" marker-end="url(#mk)"/>
  <line x1="455" y1="204" x2="455" y2="244" stroke="#ea580c" stroke-width="1.8" marker-end="url(#mk)"/>
  <rect x="340" y="248" width="230" height="54" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="455.0" y="271.0" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">物理残差 r_phys</text>
  <text x="455.0" y="290.0" text-anchor="middle" font-size="10.5" fill="#ea580c">r = z − H · x̂（潮流方程约束）</text>
  <line x1="455" y1="302" x2="455" y2="340" stroke="#ea580c" stroke-width="1.8" marker-end="url(#mk)"/>
  <rect x="60" y="344" width="250" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="185.0" y="368.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991b1b">① 数据损失</text>
  <text x="185.0" y="387.0" text-anchor="middle" font-size="10.5" fill="#dc2626">‖x̂ − x_true‖²</text>
  <rect x="370" y="344" width="320" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="530.0" y="368.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9a3412">② 物理损失 λ · L_phys</text>
  <text x="530.0" y="387.0" text-anchor="middle" font-size="10.5" fill="#ea580c">‖z − H·x̂‖²  （或方程残差）</text>
  <text x="536" y="168" font-size="11" fill="#9a3412">同一个 x̂，两条约束</text>
  <circle cx="340" cy="430" r="15" fill="#f1f5f9" stroke="#334155" stroke-width="1.8"/>
  <text x="340" y="436" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">+</text>
  <path d="M 185 400 L 185 430 L 322 430" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 530 400 L 530 430 L 358 430" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="380" y="404" width="330" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="398" y="426" font-size="12.5" font-weight="700" fill="#1e3a8a">L = L_data + λ · L_phys</text>
  <text x="398" y="446" font-size="11" fill="#b91c1c">λ 是关键，也最难调：太大解不出数据，太小物理约束形同虚设</text>
  <path d="M 356 430 L 376 430" fill="none" stroke="#334155" stroke-width="1.8"/>
</svg>