<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="mkr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="mkb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="mkp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">为什么要跑多个随机种子：单次结果是不可信的</text>
  <text x="380.0" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">同一份代码、同一个数据集，换个种子指标就能差好几个点</text>
  <text x="40" y="96" font-size="12.5" font-weight="700" fill="#dc2626">✗ 只跑一次（seed=42）</text>
  <rect x="70" y="112" width="240" height="44" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="190" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">F1 = 0.92</text>
  <text x="330" y="140" font-size="11.5" fill="#b91c1c">→ 你无法回答"这个结果稳不稳"，审稿人一定会问</text>
  <text x="40" y="196" font-size="12.5" font-weight="700" fill="#15803d">✓ 跑 5 个种子，报均值 ± 标准差</text>
  <text x="60" y="226" font-size="10.5" fill="#475569">seed 0</text>
  <rect x="110" y="212" width="235" height="18" rx="4" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>
  <text x="355" y="226" font-size="10.5" fill="#1e3a8a">0.905</text>
  <text x="60" y="252" font-size="10.5" fill="#475569">seed 1</text>
  <rect x="110" y="238" width="239" height="18" rx="4" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>
  <text x="359" y="252" font-size="10.5" fill="#1e3a8a">0.921</text>
  <text x="60" y="278" font-size="10.5" fill="#475569">seed 2</text>
  <rect x="110" y="264" width="227" height="18" rx="4" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>
  <text x="347" y="278" font-size="10.5" fill="#1e3a8a">0.874</text>
  <text x="60" y="304" font-size="10.5" fill="#475569">seed 3</text>
  <rect x="110" y="290" width="242" height="18" rx="4" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>
  <text x="362" y="304" font-size="10.5" fill="#1e3a8a">0.933</text>
  <text x="60" y="330" font-size="10.5" fill="#475569">seed 4</text>
  <rect x="110" y="316" width="233" height="18" rx="4" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>
  <text x="353" y="330" font-size="10.5" fill="#1e3a8a">0.897</text>
  <rect x="420" y="212" width="310" height="120" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="575" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">0.906 ± 0.020</text>
  <text x="575" y="266" text-anchor="middle" font-size="11" fill="#334155">极差 = 0.059（5.9 个点）</text>
  <text x="575" y="290" text-anchor="middle" font-size="11" fill="#334155">这个波动幅度，足以让"我提升了 2 个点"</text>
  <text x="575" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">变成一句站不住的话</text>
  <rect x="40" y="366" width="690" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="58" y="388" font-size="11.5" font-weight="700" fill="#1e3a8a">写作规范：任何"提升"都必须放在波动幅度里比较</text>
  <text x="58" y="410" font-size="11" fill="#334155">如果你的方法比 baseline 高 1.5 个点，而标准差是 2 个点 —— 这个"提升"在统计上不成立。</text>
</svg>